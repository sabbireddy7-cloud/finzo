<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINZO Transaction History</title>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
}
body{
    background:#f5f5f5;
    color:#222;
    min-height:100vh;
}
/* HEADER */
header{
    background:#101010;
    color:white;
    padding:18px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}
.logo{
    font-size:27px;
    font-weight:bold;
    letter-spacing:1px;
}
.back-btn{
    background:#b91c1c;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
}
.back-btn:hover{
    background:#991b1b;
}
/* CONTAINER */
.container{
    max-width:1000px;
    margin:30px auto;
    padding:0 18px;
}
/* TITLE */
.page-title{
    margin-bottom:22px;
}
.page-title h1{
    font-size:30px;
    margin-bottom:7px;
}
.page-title p{
    color:#666;
    font-size:15px;
}
/* SUMMARY */
.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}
.summary-card{
    background:white;
    padding:18px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
}
.summary-card small{
    display:block;
    color:#777;
    margin-bottom:7px;
}
.summary-card h2{
    font-size:22px;
}
/* TRANSACTION CARD */
.transaction-card{
    background:white;
    border-radius:14px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
}
.transaction-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}
.transaction-type{
    font-size:18px;
    font-weight:bold;
}
.amount{
    font-size:20px;
    font-weight:bold;
}
/* DETAILS */
.details{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}
.detail{
    background:#f7f7f7;
    padding:12px;
    border-radius:9px;
}
.detail small{
    display:block;
    color:#777;
    font-size:12px;
    margin-bottom:5px;
}
.detail span{
    font-size:14px;
}
/* STATUS */
.status{
    display:inline-block;
    padding:5px 11px;
    border-radius:20px;
    font-size:12px !important;
    font-weight:bold;
    background:#dcfce7;
    color:#166534;
}
/* EMPTY */
.empty{
    background:white;
    padding:50px 20px;
    text-align:center;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
}
.empty h2{
    margin-bottom:10px;
}
.empty p{
    color:#777;
    margin-bottom:20px;
}
.dashboard-btn{
    background:#b91c1c;
    color:white;
    border:none;
    padding:11px 20px;
    border-radius:8px;
    cursor:pointer;
}
/* CLEAR BUTTON */
.clear-area{
    text-align:right;
    margin-top:20px;
    margin-bottom:30px;
}
.clear-btn{
    background:#333;
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
}
.clear-btn:hover{
    background:#000;
}
/* MOBILE */
@media(max-width:700px){
    header{
        padding:15px;
    }
    .logo{
        font-size:23px;
    }
    .back-btn{
        padding:9px 13px;
    }
    .container{
        margin:20px auto;
        padding:0 14px;
    }
    .page-title h1{
        font-size:25px;
    }
    .summary{
        grid-template-columns:1fr;
    }
    .details{
        grid-template-columns:1fr;
    }
    .transaction-top{
        align-items:flex-start;
        gap:10px;
    }
    .transaction-type{
        font-size:16px;
    }
    .amount{
        font-size:18px;
    }
}
</style>
</head>
<body>
<!-- HEADER -->
<header>
<div class="logo">
    FINZO
</div>
<button class="back-btn" onclick="goDashboard()">
    ← Dashboard
</button>
</header>
<!-- MAIN -->
<div class="container">
<!-- PAGE TITLE -->
<div class="page-title">
    <h1>
        Transaction History
    </h1>
    <p>
        View all your FINZO transactions
    </p>
</div>
<!-- SUMMARY -->
<div class="summary">
    <div class="summary-card">
        <small>
            Total Transactions
        </small>
        <h2 id="totalTransactions">
            0
        </h2>
    </div>
    <div class="summary-card">
        <small>
            Total Amount
        </small>
        <h2 id="totalAmount">
            ₹0
        </h2>
    </div>
    <div class="summary-card">
        <small>
            Successful
        </small>
        <h2 id="successfulTransactions">
            0
        </h2>
    </div>
</div>
<!-- TRANSACTIONS -->
<div id="transactionsList"></div>
<!-- CLEAR TRANSACTIONS -->
<div class="clear-area" id="clearArea">
    <button
        class="clear-btn"
        onclick="clearTransactions()">
        Clear Demo Transactions
    </button>
</div>
</div>
<script>
/* ================================
   LOGIN PROTECTION
================================ */
if(localStorage.getItem("finzoLoggedIn") !== "true"){
    window.location.href = "login.html";
}
/* ================================
   DASHBOARD
================================ */
function goDashboard(){
    window.location.href = "dashboard.html";
}
/* ================================
   LOAD TRANSACTIONS
================================ */
function loadTransactions(){
    const container =
        document.getElementById("transactionsList");
    let transactions =
        JSON.parse(
            localStorage.getItem("finzoTransactions") || "[]"
        );
    /* SUMMARY */
    document.getElementById("totalTransactions").textContent =
        transactions.length;
    let total = 0;
    let successful = 0;
    transactions.forEach(function(transaction){
        total += Number(transaction.amount || 0);
        if(
            !transaction.status ||
            transaction.status.toLowerCase() === "success"
        ){
            successful++;
        }
    });
    document.getElementById("totalAmount").textContent =
        "₹" + total.toLocaleString("en-IN");
    document.getElementById("successfulTransactions").textContent =
        successful;
    /* NO TRANSACTIONS */
    if(transactions.length === 0){
        container.innerHTML = `
            <div class="empty">
                <h2>
                    No Transactions Yet
                </h2>
                <p>
                    Your FINZO transactions will appear here.
                </p>
                <button
                    class="dashboard-btn"
                    onclick="goDashboard()">
                    Go to Dashboard
                </button>
            </div>
        `;
        document.getElementById("clearArea").style.display =
            "none";
        return;
    }
    document.getElementById("clearArea").style.display =
        "block";
    container.innerHTML = "";
    /* NEWEST FIRST */
    transactions.forEach(function(transaction){
        let amount =
            Number(transaction.amount || 0);
        let type =
            transaction.type || "Transaction";
        let method =
            transaction.method || "N/A";
        let date =
            transaction.date || "N/A";
        let status =
            transaction.status || "Success";
        let details =
            transaction.details || "";
        const card =
            document.createElement("div");
        card.className =
            "transaction-card";
        card.innerHTML = `
            <div class="transaction-top">
                <div class="transaction-type">
                    ${type}
                </div>
                <div class="amount">
                    ₹${amount.toLocaleString("en-IN")}
                </div>
            </div>
            <div class="details">
                <div class="detail">
                    <small>
                        Date & Time
                    </small>
                    <span>
                        ${date}
                    </span>
                </div>
                <div class="detail">
                    <small>
                        Payment Method
                    </small>
                    <span>
                        ${method}
                    </span>
                </div>
                <div class="detail">
                    <small>
                        Status
                    </small>
                    <span class="status">
                        ${status}
                    </span>
                </div>
            </div>
            ${
                details
                ?
                `
                <div
                    style="
                    margin-top:12px;
                    padding:10px;
                    background:#fafafa;
                    border-radius:8px;
                    font-size:13px;
                    color:#666;
                    "
                >
                    ${details}
                </div>
                `
                :
                ""
            }
        `;
        container.appendChild(card);
    });
}
/* ================================
   CLEAR DEMO TRANSACTIONS
================================ */
function clearTransactions(){
    const confirmClear =
        confirm(
            "Are you sure you want to clear all demo transactions?"
        );
    if(!confirmClear){
        return;
    }
    localStorage.removeItem(
        "finzoTransactions"
    );
    loadTransactions();
}
/* ================================
   AUTO REFRESH
================================ */
window.addEventListener(
    "pageshow",
    function(){
        loadTransactions();
    }
);
window.addEventListener(
    "storage",
    function(){
        loadTransactions();
    }
);
/* ================================
   START
================================ */
loadTransactions();
</script>
</body>
</html>
