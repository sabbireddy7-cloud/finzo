<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FINZO - KYC</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    color:#222;
}

.header{
    background:#101010;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#ff3333;
}

.dashboard-btn{
    text-decoration:none;
    color:white;
    background:#b91c1c;
    padding:10px 18px;
    border-radius:8px;
    font-size:14px;
}

.container{
    max-width:700px;
    margin:30px auto;
    padding:0 15px;
}

.card{
    background:white;
    padding:28px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

h1{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:25px;
    font-size:14px;
}

.section{
    margin-top:25px;
    padding:18px;
    background:#fafafa;
    border:1px solid #e5e5e5;
    border-radius:12px;
}

.section-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
    color:#b91c1c;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#b91c1c;
}

input[type="file"]{
    background:white;
    padding:10px;
}

.submit-btn{
    width:100%;
    margin-top:25px;
    padding:14px;
    background:#b91c1c;
    color:white;
    border:none;
    border-radius:9px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.submit-btn:hover{
    background:#991b1b;
}

.message{
    display:none;
    margin-top:18px;
    padding:13px;
    border-radius:8px;
    text-align:center;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.status{
    margin-top:20px;
    padding:15px;
    background:#fff7ed;
    border:1px solid #fed7aa;
    border-radius:10px;
    text-align:center;
    color:#9a3412;
    font-size:14px;
}

.note{
    margin-top:18px;
    color:#777;
    font-size:12px;
    line-height:1.5;
    text-align:center;
}

@media(max-width:600px){

    .header{
        padding:15px;
    }

    .logo{
        font-size:24px;
    }

    .card{
        padding:20px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <div class="logo">
        FINZO
    </div>

    <a href="dashboard.html" class="dashboard-btn">
        Dashboard
    </a>

</div>


<div class="container">

<div class="card">

<h1>KYC Verification</h1>

<p class="subtitle">
Complete your KYC details
</p>


<!-- AADHAAR SECTION -->

<div class="section">

<div class="section-title">
Aadhaar Card Details
</div>

<label for="aadhaarFile">
Upload Aadhaar Card
</label>

<input
    type="file"
    id="aadhaarFile"
    accept="image/*,.pdf"
/>


<label for="aadhaarNumber">
Aadhaar Number
</label>

<input
    type="text"
    id="aadhaarNumber"
    placeholder="Enter 12-digit Aadhaar number"
    maxlength="12"
    inputmode="numeric"
/>

</div>


<!-- PAN SECTION -->

<div class="section">

<div class="section-title">
PAN Card Details
</div>

<label for="panFile">
Upload PAN Card
</label>

<input
    type="file"
    id="panFile"
    accept="image/*,.pdf"
/>


<label for="panNumber">
PAN Card Number
</label>

<input
    type="text"
    id="panNumber"
    placeholder="Enter PAN number"
    maxlength="10"
    style="text-transform:uppercase;"
/>

</div>


<!-- BANK SECTION -->

<div class="section">

<div class="section-title">
Bank Details
</div>

<label for="bankFile">
Upload Bank Details
</label>

<input
    type="file"
    id="bankFile"
    accept="image/*,.pdf"
/>


<label for="bankName">
Bank Name
</label>

<input
    type="text"
    id="bankName"
    placeholder="Enter bank name"
/>


<label for="accountNumber">
Bank Account Number
</label>

<input
    type="text"
    id="accountNumber"
    placeholder="Enter bank account number"
    inputmode="numeric"
/>


<!-- IFSC CODE ADDED -->

<label for="ifscCode">
IFSC Code
</label>

<input
    type="text"
    id="ifscCode"
    placeholder="Enter IFSC code"
    maxlength="11"
    style="text-transform:uppercase;"
/>

</div>


<!-- PROFILE PHOTO -->

<div class="section">

<div class="section-title">
Profile Photo
</div>

<label for="profilePhoto">
Upload Profile Photo
</label>

<input
    type="file"
    id="profilePhoto"
    accept="image/*"
/>

</div>


<!-- SUBMIT -->

<button
    class="submit-btn"
    onclick="submitKYC()"
>
    Submit KYC
</button>


<!-- MESSAGE -->

<div
    id="message"
    class="message"
></div>


<!-- STATUS -->

<div class="status">

    KYC Status:
    <strong id="kycStatus">
        Not Submitted
    </strong>

</div>


<div class="note">
Demo KYC page for FINZO website development.
Do not upload real Aadhaar, PAN, bank documents or other sensitive personal information to this demo.
</div>

</div>

</div>


<script>

/* LOGIN PROTECTION */

if(localStorage.getItem("finzoLoggedIn") !== "true"){
    window.location.href = "login.html";
}


/* LOAD SAVED STATUS */

const savedKYC =
    localStorage.getItem("finzoKYCSubmitted");

if(savedKYC === "true"){

    document.getElementById("kycStatus")
        .textContent = "Submitted";

}


/* SUBMIT KYC */

function submitKYC(){

    const aadhaarFile =
        document.getElementById("aadhaarFile").files[0];

    const aadhaarNumber =
        document.getElementById("aadhaarNumber").value.trim();

    const panFile =
        document.getElementById("panFile").files[0];

    const panNumber =
        document.getElementById("panNumber").value
        .trim()
        .toUpperCase();

    const bankFile =
        document.getElementById("bankFile").files[0];

    const bankName =
        document.getElementById("bankName").value.trim();

    const accountNumber =
        document.getElementById("accountNumber").value.trim();

    /* IFSC CODE */

    const ifscCode =
        document.getElementById("ifscCode").value
        .trim()
        .toUpperCase();

    const profilePhoto =
        document.getElementById("profilePhoto").files[0];


    /* AADHAAR VALIDATION */

    if(!aadhaarFile){

        showMessage(
            "Please upload Aadhaar Card.",
            "error"
        );

        return;
    }


    if(!/^\d{12}$/.test(aadhaarNumber)){

        showMessage(
            "Please enter a valid 12-digit Aadhaar number.",
            "error"
        );

        return;
    }


    /* PAN VALIDATION */

    if(!panFile){

        showMessage(
            "Please upload PAN Card.",
            "error"
        );

        return;
    }


    if(!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(panNumber)){

        showMessage(
            "Please enter a valid PAN number.",
            "error"
        );

        return;
    }


    /* BANK VALIDATION */

    if(!bankFile){

        showMessage(
            "Please upload Bank Details.",
            "error"
        );

        return;
    }


    if(bankName === ""){

        showMessage(
            "Please enter Bank Name.",
            "error"
        );

        return;
    }


    if(accountNumber === ""){

        showMessage(
            "Please enter Bank Account Number.",
            "error"
        );

        return;
    }


    /* IFSC VALIDATION */

    if(!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifscCode)){

        showMessage(
            "Please enter a valid 11-character IFSC Code.",
            "error"
        );

        return;
    }


    /* PROFILE PHOTO */

    if(!profilePhoto){

        showMessage(
            "Please upload Profile Photo.",
            "error"
        );

        return;
    }


    /* SAVE DEMO KYC STATUS */

    localStorage.setItem(
        "finzoKYCSubmitted",
        "true"
    );


    /* UPDATE STATUS */

    document.getElementById("kycStatus")
        .textContent = "Submitted";


    showMessage(
        "KYC submitted successfully! This is a demo submission.",
        "success"
    );

}


/* MESSAGE FUNCTION */

function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display = "block";

}

</script>

</body>
</html>
