<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FINZO - Add Money</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #171717;
    }

    header {
      background: #101010;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
    }

    .back-btn {
      text-decoration: none;
      color: white;
      background: #b91c1c;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
    }

    .container {
      max-width: 600px;
      margin: 35px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 28px;
      border: 1px solid #e5e5e5;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #737373;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .balance {
      background: linear-gradient(135deg, #b91c1c, #7f1d1d);
      color: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 25px;
    }

    .balance-title {
      font-size: 13px;
      opacity: 0.9;
    }

    .balance-amount {
      font-size: 28px;
      font-weight: bold;
      margin-top: 7px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d4d4d4;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #b91c1c;
    }

    .quick-title {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .quick-amounts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .quick-btn {
      background: white;
      border: 1px solid #d4d4d4;
      padding: 11px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .quick-btn:hover {
      border-color: #b91c1c;
      color: #b91c1c;
    }

    .pay-btn {
      width: 100%;
      border: none;
      background: #b91c1c;
      color: white;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .pay-btn:hover {
      background: #991b1b;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .note {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: #737373;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px auto;
      }

      .card {
        padding: 20px;
      }

      .quick-amounts {
        grid-template-columns: repeat(2, 1fr);
      }

      header {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">FINZO</div>

    <a href="dashboard.html" class="back-btn">
      ← Dashboard
    </a>
  </header>


  <div class="container">

    <div class="card">

      <h1>💰 Add Money</h1>

      <p class="subtitle">
        Add money to your FINZO wallet
      </p>


      <!-- Wallet Balance -->

      <div class="balance">

        <div class="balance-title">
          Current Wallet Balance
        </div>

        <div class="balance-amount" id="balance">
          ₹0
        </div>

      </div>


      <!-- Payment Method -->

      <div class="field">

        <label>
          Payment Method
        </label>

        <select id="paymentMethod">

          <option value="">
            Select Payment Method
          </option>

          <option value="UPI">
            UPI
          </option>

          <option value="Card">
            Credit / Debit Card
          </option>

          <option value="Net Banking">
            Net Banking
          </option>

          <option value="Wallet">
            Wallet
          </option>

        </select>

      </div>


      <!-- Quick Amount -->

      <div class="quick-title">
        Quick Amount
      </div>

      <div class="quick-amounts">

        <button class="quick-btn"
          onclick="setAmount(500)">
          ₹500
        </button>

        <button class="quick-btn"
          onclick="setAmount(1000)">
          ₹1,000
        </button>

        <button class="quick-btn"
          onclick="setAmount(2000)">
          ₹2,000
        </button>

        <button class="quick-btn"
          onclick="setAmount(5000)">
          ₹5,000
        </button>

        <button class="quick-btn"
          onclick="setAmount(10000)">
          ₹10,000
        </button>

        <button class="quick-btn"
          onclick="setAmount(20000)">
          ₹20,000
        </button>

      </div>


      <!-- Amount -->

      <div class="field">

        <label>
          Enter Amount
        </label>

        <input
          type="number"
          id="amount"
          placeholder="Enter amount"
          min="1"
          max="100000"
        >

      </div>


      <button
        class="pay-btn"
        onclick="addMoney()">

        Proceed to Add Money

      </button>


      <div
        class="message"
        id="message">
      </div>


      <p class="note">
        Demo only — no real money will be added.
      </p>

    </div>

  </div>


  <script>

    // Get existing demo wallet balance

    let balance =
      Number(localStorage.getItem("finzoWalletBalance")) || 0;


    function displayBalance() {

      document.getElementById("balance").textContent =
        "₹" + balance.toLocaleString("en-IN");

    }


    displayBalance();


    // Quick amount buttons

    function setAmount(amount) {

      document.getElementById("amount").value =
        amount;

    }


    // Add money

    function addMoney() {

      const method =
        document.getElementById("paymentMethod").value;

      const amount =
        Number(document.getElementById("amount").value);


      if (!method) {

        showMessage(
          "Please select a payment method.",
          "error"
        );

        return;
      }


      if (!amount || amount <= 0) {

        showMessage(
          "Please enter a valid amount.",
          "error"
        );

        return;
      }


      if (amount > 100000) {

        showMessage(
          "Maximum demo amount is ₹1,00,000.",
          "error"
        );

        return;
      }


      // Update wallet balance

      balance += amount;

      localStorage.setItem(
        "finzoWalletBalance",
        balance
      );


      // Save transaction

      const transaction = {

        type: "Add Money",

        method: method,

        amount: amount,

        date: new Date().toLocaleString("en-IN")

      };


      let transactions =
        JSON.parse(
          localStorage.getItem("finzoTransactions")
        ) || [];


      transactions.unshift(transaction);


      localStorage.setItem(
        "finzoTransactions",
        JSON.stringify(transactions)
      );


      displayBalance();


      showMessage(
        "₹" +
        amount.toLocaleString("en-IN") +
        " added successfully! (Demo)",
        "success"
      );


      document.getElementById("amount").value = "";

    }


    function showMessage(text, type) {

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.className =
        "message " + type;

      message.style.display = "block";

    }

  </script>

</body>
</html>
